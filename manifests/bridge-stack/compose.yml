---
# Phase 2 bridge stack.
#
# Topology (kit-v2 §F.2 / §1.13):
#
#   - The Network Loader's `tunnel` container owns wg100 + an
#     attachment on the kit-admin docker network. It's already up
#     (Phase 1) by the time this compose runs.
#   - caddy-bridge, alloy, caddy-internal all share the tunnel
#     container's netns via `network_mode: container:`. They
#     reach operator services through wg100 and reach kit-admin
#     containers (valkey, eventually caddy-waf) through the
#     tunnel container's admin NIC.
#   - valkey is the only bridge-stack member NOT in the tunnel
#     netns: it lives on kit-admin so caddy-waf (separate stack)
#     can reach it without going through the tunnel netns. It
#     also publishes inside the tunnel netns by binding to the
#     admin-NIC IP from the tunnel container's perspective.
#
# Env vars come from /etc/bootstrap (rendered by network-loader
# from the /redeem package).  The orchestrator binary expands
# `${VAR}` references at compose-up time.

x-logging: &x-default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "5"
    compress: "true"

# kit-admin: created externally (via the manifest's docker.networks).
# All four volumes are external too — `keep` action in service.json.
networks:
  kit-admin:
    external: true
    name: kit-admin

volumes:
  # caddy_data, caddy_config, caddy_logs, alloy_data, valkey_data:
  # created by the orchestrator at compose-up time per the
  # bridge-stack manifest's docker.volumes declarations.
  caddy_data:    { external: true, name: caddy_data }
  caddy_config:  { external: true, name: caddy_config }
  caddy_logs:    { external: true, name: caddy_logs }
  alloy_data:    { external: true, name: alloy_data }
  valkey_data:   { external: true, name: valkey_data }
  # tunnel_state: created by the foundation compose
  # (waf/corewaf-starter-kit/compose.yml) with explicit `name:`
  # so the cross-project reference here lands on the same volume.
  # caddy-bridge reads /var/lib/tunnel/{secret/ztk, mtls/cert.pem,
  # package.json} from this mount.
  tunnel_state:  { external: true, name: tunnel_state }

services:

  # --------------------------------------------------------------
  # caddy-internal — corewaf caddy-docker-proxy build.
  #
  # All routing config comes from `caddy.*` labels on other
  # containers (caddy-bridge, valkey, alloy, eventually caddy-waf):
  # caddy-docker-proxy watches /var/run/docker.sock, sees label
  # changes, and rewrites the live Caddy admin config (port 2019).
  # No static Caddyfile; the proxy's defaults plus labels are the
  # whole story.
  #
  # ACME client lives inside Caddy itself — it'll reach step-ca
  # through the tunnel netns (operator-side via wg100). Cert
  # storage is on the caddy_data volume so renewals survive
  # restarts.
  # --------------------------------------------------------------
  caddy-internal:
    image: ${CADDY_INTERNAL_IMAGE}
    pull_policy: missing
    container_name: corewaf-caddy-internal
    restart: unless-stopped
    network_mode: "container:${TUNNEL_CONTAINER_NAME}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # tunnel_state read-only — network-loader writes the operator
      # root CA at /var/lib/tunnel/mtls/operator-ca.pem on every
      # successful /reconnect. Caddy reads it via the `acme_ca_root`
      # global option below so the ACME flow trusts step-ca's HTTPS
      # without requiring system-trust mods (no root in the container).
      - tunnel_state:/var/lib/tunnel:ro
    environment:
      # caddy-docker-proxy controls — make the proxy pick up labels
      # from any docker network attached to the daemon (the tunnel
      # netns owns one set of attachments, kit-admin another).
      CADDY_DOCKER_MODE: standalone
      CADDY_DOCKER_LABEL_PREFIX: caddy
    labels:
      # ── ACME global options (kit-v2 §1.8 mgmt-plane flow) ──
      # acme_ca points at the operator's step-ca ACME directory
      # (rendered by orchestrator from /etc/bootstrap's `acme_url`).
      # acme_ca_root tells Caddy to trust step-ca's HTTPS chain when
      # dialing the directory and during the challenge round-trip —
      # config-level trust, no `update-ca-certificates`. The CA file
      # is on the tunnel_state volume mounted above.
      #
      # An empty `acme_url` (operator hasn't configured this endpoint
      # in the tenant chain) needs to leave Caddy on its built-in
      # ACME issuer default — Caddy still starts; per-site cert
      # acquisition simply uses internal/snakeoil instead of step-ca.
      #
      # ${acme_url:-...} placeholder default: an empty value would
      # cause caddy-docker-proxy to emit `acme_ca` with no argument,
      # which makes the Caddyfile global block fail to parse and the
      # whole config gets dropped (Round-1 incident). The placeholder
      # URL is never dialed unless a site actually requests ACME, so
      # the kit boots fine even with no real ACME upstream.
      # Same applies to acme_ca_root — its file must exist to be
      # readable; only meaningful when ACME is actually used.
      caddy.email: kit@internal
      caddy.acme_ca: ${acme_url:-https://acme.disabled.invalid/directory}
      caddy.acme_ca_root: /var/lib/tunnel/mtls/operator-ca.pem
      # Alloy's discovery.docker picks these up via
      # __meta_docker_container_label_* and turns this container
      # into a metrics + logs target. See manifests/bridge-stack/
      # templates/alloy.tmpl for the relabel rules.
      prometheus.io/scrape: "true"
      prometheus.io/port: "2019"
      prometheus.io/path: /metrics
      loki.io/scrape: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging: *x-default-logging

  # --------------------------------------------------------------
  # caddy-bridge — operator action listener + control-plane channel
  # --------------------------------------------------------------
  caddy-bridge:
    image: ${CADDY_BRIDGE_IMAGE}
    pull_policy: missing
    container_name: corewaf-bridge
    restart: unless-stopped
    network_mode: "container:${TUNNEL_CONTAINER_NAME}"
    # Run as root inside the kit. Two reasons, both Round-1 simplifications:
    #   1. tunnel_state files (discovery.json, bootstrap, operational.json)
    #      are written by network-loader mode 0600 root:root. uid 1100
    #      (the image's default `bridge` user) can't read them. Proper
    #      fix is network-loader writing non-secret files 0644 — tracked
    #      separately. Until then, root reads everything.
    #   2. /var/run/docker.sock requires the host docker GID; without
    #      `group_add: [${DOCKER_GID}]` the bridge gets EACCES on the
    #      socket. Running as root sidesteps the group-add dance.
    # The bridge already has docker.sock access for the `restart`/
    # `get-logs` actions, which is effectively root-equivalent, so
    # the security regression is nil.
    user: "0"
    environment:
      # Operator-side endpoints come from /etc/bootstrap, expanded
      # by the orchestrator at compose-up time.
      #
      # API_GATEWAY_URL flows from /reconnect's resolved endpoint:
      # network-loader sets ${core_api_gateway_url} =
      # Operational.Endpoints.APIGateway (pkg.go), which the gateway
      # resolves by chain-walking the tenant→owner→apex endpoints and
      # finally the provisioning-space tunnel defaults
      # (/system/tunnel/defaults → endpoint_fallback). No hardcoded
      # address in the kit — the gateway is the single source of the
      # API endpoint, bootstrapped fresh on every /reconnect.
      API_GATEWAY_URL: ${core_api_gateway_url}
      # X-Scope-OrgID the bridge sends on caddy_api calls.
      #
      # The gateway delivers ${xorg_scope_id} in the bootstrap, but
      # that's the kit's TENANT name (e.g. "att-com-soylent") — a
      # kind=tenant record, which v3 Casbin does NOT grant
      # create:caddy_instance on. The right identity is a service-
      # identity like "att-caddy-owner" (kind=service-identity, role=
      # operator_resources_role) derived from the kit's carrier.
      #
      # Until tunnel-gw's /reconnect chain-walks the carrier and
      # picks the right caddy-owner identity, hardcode the elevated
      # system-admin (matches bridge's pre-v3 default behaviour).
      # Round-2 fix is in tunnel-gw; then this line returns to
      # ${xorg_scope_id}.
      BRIDGE_SCOPE_ORGID: "corero-system-admin"
      # Reverse URL template: caddy_api dials https://actions.<hw_id>.
      # <gateway_id>.<bridges_zone>:446/, which operator DNS resolves
      # through the kit's CNAME (created by caddy_api on registration) →
      # gateway A record (created by provisioning_api on gateway
      # registration; value is the gateway's apparent source-IP as seen
      # by the API — survives NAT) → gateway bridge-proxy listener, which
      # routes back into this kit by SNI. The {hw_id} placeholder is
      # filled by the bridge from its instance_name at registration time.
      # Empty => disabled; the bridge falls back to its private-IP
      # derivation (in-host dev only).
      BRIDGE_REVERSE_URL_TEMPLATE: ${bridge_reverse_url_template:-}
      NAMESPACE: ${namespace}
      TUNNEL_CLIENT_IP: ${tunnel_client_ip}
      ZTK_SECRET_PATH: /var/lib/tunnel/secret/ztk
      MTLS_CERT_PATH: /var/lib/tunnel/mtls/cert.pem
      MTLS_PKCS11_URI: ${mtls_pkcs11_uri}
      HW_ID: ${hw_id}
      KIT_VERSION: ${kit_version}
      # Bridge looks for discovery.json under HWINFO_DIR; the default
      # is /var/lib/hwinfo (legacy hw-introspect path). Network Loader
      # (Phase 1) writes it to /var/lib/tunnel/discovery.json, which
      # this volume already mounts at /var/lib/tunnel below — point
      # the bridge at the same path so it picks up the real
      # orchestrator-driven hw facts (instance_name, cluster_id,
      # machine_id, hardware_fingerprint) instead of falling back to
      # local introspection inside the netns'd container.
      HWINFO_DIR: /var/lib/tunnel
      # Trust the operator's root CA for outbound HTTPS to the API
      # gateway. Python's `ssl` module reads SSL_CERT_FILE as its
      # default trust anchor; httpx (and anything else stdlib-backed
      # in caddy-bridge) inherits it. The file is written by
      # network-loader on every successful /reconnect onto the
      # tunnel_state volume already mounted at /var/lib/tunnel:ro
      # below. Same single-source-of-truth file caddy-internal reads
      # for its ACME trust pool.
      SSL_CERT_FILE: /var/lib/tunnel/mtls/operator-ca.pem
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8090
      # Bridge resolves caddy-waf via TWO independent paths:
      #
      #   1. Docker socket + label discovery (docker_controller). This
      #      is what the action surfaces that exec into the container
      #      (restart, get-logs, get-waf-state) use to find the right
      #      container. Strictly label-filtered: corewaf.io/managed=true
      #      + corewaf.io/role=caddy-waf.
      #
      #   2. Admin HTTP URL (caddy_admin_client). The bridge's
      #      get-config / load-config talk to the Caddy admin API at
      #      this URL. It is NOT discovery-driven today — has to be
      #      set explicitly. localhost:2019 (the config.py default)
      #      lands on caddy-internal here, NOT the WAF, because the
      #      bridge shares the tunnel container's netns and
      #      caddy-internal listens on 127.0.0.1:2019 there.
      #
      # caddy-waf binds admin on :2019 inside its own netns; reachable
      # from the bridge via the kit-admin network alias.
      CADDY_ADMIN_URL: http://corewaf-caddy:2019
      # The caddy the bridge manages + introspects (version/modules at
      # registration). Set explicitly: the docker_controller image-name
      # heuristic would otherwise self-match ``caddy-bridge`` (its own
      # image also contains "caddy") and report version=unknown, modules=[].
      CADDY_CONTAINER_NAME: corewaf-caddy
      HEARTBEAT_INTERVAL_SECONDS: 30
      CADDY_MONITOR_INTERVAL_SECONDS: 60
    volumes:
      # Read tunnel-state artifacts written by network-loader
      # (package, secrets, mTLS cert).
      - tunnel_state:/var/lib/tunnel:ro
      # Action handlers (`restart`, `get-logs`) talk to the docker
      # daemon directly.
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # caddy-docker-proxy hooks: route bridge-API requests on the
      # caddy-internal admin path to this container.
      # Serve two SNIs/hosts: the canonical ``bridge.internal`` (for
      # in-kit clients) and the kit's WG-allocated address (for the
      # operator-side bridge proxy in tunnel-gateway, which dials this
      # kit by its ZTK.spec.tunnel.clientIP — httpx uses that hostname
      # as the SNI, so caddy-internal must have a matching site).
      # Two ordered sites, both reverse-proxying to caddy-bridge :8090.
      #
      # caddy_0 — the canonical bridge.internal + the kit's WG address, on the
      # INTERNAL CA. In-kit clients + the legacy verify=False bridge-proxy path
      # use these; the cert lives only inside the WG tunnel.
      caddy_0: "bridge.internal ${tunnel_client_ip}"
      caddy_0.tls: internal
      caddy_0.reverse_proxy: "${tunnel_client_ip}:8090"
      # caddy_1 — the operator-facing reverse-channel name, served with a REAL
      # step-ca cert via FORCED TLS-ALPN-01. The gateway's caddy-l4 :443 front
      # routes operator->kit (and the step-ca ACME challenge) to this SNI, and
      # the kit terminates here -> end-to-end TLS (#97/#98). bridge_fqdn =
      # <hw_id>.<gw>.bridges.internal, derived by network-loader into
      # /etc/bootstrap. disable_http_challenge forces tls-alpn-01: step-ca can
      # only reach the kit by SNI on :443 through the L4 front, never on :80.
      caddy_1: "${bridge_fqdn}"
      # `issuer acme { ... }` — acme is the issuer's inline argument, so it maps
      # to `caddy_1.tls.issuer: acme` plus sub-keys (NOT a `.acme.` nesting,
      # which renders the invalid `issuer { acme { ... } }` and gets dropped).
      caddy_1.tls.issuer: acme
      caddy_1.tls.issuer.dir: "${acme_url}"
      caddy_1.tls.issuer.trusted_roots: /var/lib/tunnel/mtls/operator-ca.pem
      caddy_1.tls.issuer.disable_http_challenge: ""
      caddy_1.reverse_proxy: "${tunnel_client_ip}:8090"
      # Alloy docker-label discovery (see alloy.tmpl). caddy-bridge
      # exposes /metrics on its service port.
      prometheus.io/scrape: "true"
      prometheus.io/port: "8090"
      prometheus.io/path: /metrics
      loki.io/scrape: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *x-default-logging

  # --------------------------------------------------------------
  # alloy — telemetry shipper (Loki / Mimir / OTEL)
  # --------------------------------------------------------------
  alloy:
    image: ${ALLOY_IMAGE}
    pull_policy: missing
    container_name: corewaf-alloy
    restart: unless-stopped
    network_mode: "container:${TUNNEL_CONTAINER_NAME}"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./runtime/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - caddy_logs:/caddy_logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *x-default-logging

  # --------------------------------------------------------------
  # valkey — Redis-compatible state backend
  # --------------------------------------------------------------
  valkey:
    image: ${VALKEY_IMAGE}
    pull_policy: missing
    container_name: corewaf-valkey
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --appendonly no
    networks:
      - kit-admin
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *x-default-logging
